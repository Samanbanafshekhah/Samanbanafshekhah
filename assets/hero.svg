<rect x="1" y="1" width="958" height="332" rx="22" fill="url(#bg)" stroke="#253044"/>
<circle cx="783" cy="161" r="210" fill="url(#halo)"/><path d="M36 1 H320" stroke="url(#accent)" stroke-width="2"/><text x="44" y="49" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="3">SAMAN / DEVELOPER</text><text x="44" y="120" fill="#F8FAFC" font-size="48" font-weight="700" >Engineering</text><text x="44" y="178" fill="#F8FAFC" font-size="48" font-weight="700" >with purpose.</text><text x="46" y="224" fill="#B4C2D5" font-size="18" font-weight="400" >Full-stack development. Backend at heart.</text><text x="46" y="257" fill="#7F91AB" font-size="14" font-weight="400" >Clean APIs · Business systems · DevOps exploration</text><rect x="44" y="286" width="242" height="27" rx="13.5" fill="#142333" stroke="#254356"/><circle cx="60" cy="299" r="3" fill="#22D3EE"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></circle><text x="72" y="304" fill="#83DCE9" font-size="10" font-weight="600" letter-spacing=".5">BUILD · REFINE · KEEP LEARNING</text><g transform="translate(780 165)"><circle r="58" fill="none" stroke="#26384F" stroke-width="1"/><circle r="91" fill="none" stroke="#26384F" stroke-width="1"/><circle r="123" fill="none" stroke="#26384F" stroke-width="1"/><path d="M-58 0 H58 M0 -58 V58" stroke="#2B415B" stroke-dasharray="3 7"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><circle r="91" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="110 462"/><circle cx="91" r="5" fill="#22D3EE"/></g><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="52s" repeatCount="indefinite"/><circle cx="-123" r="4" fill="#A78BFA"/><circle r="123" fill="none" stroke="#A78BFA" stroke-opacity=".45" stroke-dasharray="20 753"/></g><rect x="-36" y="-36" width="72" height="72" rx="20" fill="#101D30" stroke="#37546F"/><text x="0" y="10" fill="#7DE3F1" font-size="27" font-weight="600" text-anchor="middle">&lt;/&gt;</text></g>
</g></svg>